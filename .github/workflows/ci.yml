name: CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./scripts/ci.sh
  java21:
    # The Java 21 variant (docs/BACKPORTING.md) builds and passes every test, so it stays possible.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon --console=plain build -PjavaVersion=21 -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64

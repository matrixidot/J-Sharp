# The language server, CLI and Gradle plugin tests on Windows (D103): paths, URIs and process
# launching differ there, and most J# users run Windows. Of the IntelliJ plugin tests, only those
# that start the bundled CLI run here: in the others, the headless CLion never finishes indexing on
# Windows runners.
name: Windows
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tools:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Language server, CLI and Gradle plugin
        run: ./gradlew :lsp:test :cli:test :gradle-plugin:test --console=plain --continue
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-tools-reports
          path: |
            lsp/build/test-results/
            cli/build/test-results/
            gradle-plugin/build/test-results/

  intellij:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: IntelliJ plugin, starting the CLI and the language server
        run: >-
          ./gradlew -p editors/intellij test --console=plain
          --tests "*.testRunningAProgramWithItsLibraryFiles"
          --tests "*.testLanguageServerAnswers"
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-intellij-reports
          path: editors/intellij/build/test-results/

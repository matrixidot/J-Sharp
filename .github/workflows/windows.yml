# The compiler, language server, CLI and IntelliJ plugin tests on Windows (D103): paths, URIs and
# process launching differ there, and most J# users run Windows.
name: Windows
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Language server and CLI
        run: ./gradlew :lsp:test :cli:test --console=plain --continue
      - name: IntelliJ plugin
        if: success() || failure()
        run: ./gradlew -p editors/intellij test --console=plain
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-reports
          path: |
            lsp/build/test-results/
            cli/build/test-results/
            editors/intellij/build/test-results/
            editors/intellij/build/idea-sandbox/**/log/idea.log

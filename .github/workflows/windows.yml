# The language server, CLI and Gradle plugin tests on Windows (D103): paths, URIs and process
# launching differ there, and most J# users run Windows. (The IntelliJ plugin tests are not run
# here: the headless CLion they use never finishes indexing on Windows runners.)
name: Windows
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tools:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Language server, CLI and Gradle plugin
        run: ./gradlew :lsp:test :cli:test :gradle-plugin:test --console=plain --continue
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-tools-reports
          path: |
            lsp/build/test-results/
            cli/build/test-results/
            gradle-plugin/build/test-results/
